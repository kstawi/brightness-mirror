; BrightnessMirror settings. Changes apply on the next brightness change, no restart needed.

; External monitor brightness (%) when the laptop screen is at 0% and at 100%.
; Values in between are scaled linearly. Example: MinOutput=10 keeps the external
; monitor 10 points brighter at the dark end.
MinOutput=0
MaxOutput=100

; Minimum gap between commands sent to the monitor, in milliseconds (50-2000).
; Raise it if the monitor misses changes while you drag the slider.
IntervalMs=150
